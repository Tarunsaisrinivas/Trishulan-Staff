services:
  web:
    container_name: trishulan-emp

    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "3000:3000"

    env_file:
      - .env.local

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

    environment:
      NODE_ENV: development

    restart: unless-stopped
